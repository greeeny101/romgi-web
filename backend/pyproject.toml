[project]
name = "romgi-web-backend"
version = "0.1.0"
description = "Django/Celery backend for romgi-web"
requires-python = ">=3.12"
dependencies = [
    "Django>=5.1,<5.2",
    "django-ninja>=1.3,<2.0",
    "django-ninja-jwt>=5.4,<6.0",
    "django-ninja-extra>=0.31,<1.0",
    "email-validator>=2.2,<3.0",
    "django-environ>=0.11,<1.0",
    "django-cors-headers>=4.4,<5.0",
    "psycopg[binary]>=3.2,<4.0",
    "celery>=5.4,<6.0",
    "django-celery-beat>=2.7,<3.0",
    "redis>=5.0,<6.0",
    "channels>=4.1,<5.0",
    "channels-redis>=4.2,<5.0",
    "daphne>=4.1,<5.0",
    "django-storages>=1.14,<2.0",
    "cryptography>=43.0,<44.0",
    # Catalog ingestion pipeline
    "PyYAML>=6.0,<7.0",
    "requests>=2.32,<3.0",
    "cloudscraper>=1.2,<2.0",
    "Unidecode>=1.3,<2.0",
    "playwright>=1.47,<2.0",
    # Download pipeline
    "py7zr>=0.22,<1.0",
    # >=2026.8 required: older clients check the login response body for the
    # literal string "Ok." and treat qBittorrent 5.x's 204-No-Content success
    # response as a failed login (verified against linuxserver/qbittorrent:latest,
    # which now ships qBittorrent 5.2.3 / WebAPI 2.15.1).
    "qbittorrent-api>=2026.8,<2027.0",
]

[project.optional-dependencies]
production = [
    "gunicorn>=23.0,<24.0",
    "sentry-sdk>=2.14,<3.0",
    "boto3>=1.35,<2.0",
]

[dependency-groups]
dev = [
    "django-debug-toolbar>=4.4,<5.0",
    "pytest>=8.3,<9.0",
    "pytest-django>=4.9,<5.0",
    "pytest-cov>=5.0,<6.0",
    "factory-boy>=3.3,<4.0",
    "ruff>=0.6,<1.0",
]

[tool.uv]
# This is an application, not a distributable library — nothing under
# apps/ or config/ needs to be built/installed as a package, just have its
# dependencies resolved into .venv.
package = false
# `uv sync` with no flags matches the old requirements/development.txt
# (base + dev tooling) — the common case for local/Docker-Compose dev.
# Production builds opt out explicitly: `uv sync --no-default-groups --extra production`.
default-groups = ["dev"]

[tool.ruff]
target-version = "py312"
line-length = 119

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.development"
python_files = ["test_*.py", "*_test.py"]
