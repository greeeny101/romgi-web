name: romgi-web

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: romgi
      POSTGRES_PASSWORD: romgi
      POSTGRES_DB: romgi
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U romgi"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    ports:
      - "127.0.0.1:6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  django:
    build:
      context: ./backend
    command: >
      sh -c "python manage.py migrate &&
             python manage.py setup_periodic_tasks &&
             daphne -b 0.0.0.0 -p 8000 config.asgi:application"
    env_file: ./backend/.env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.development
    volumes:
      - ./backend:/app
      - staged_files:/app/data/staged
      - torrent_data:/app/data/torrents
      - rom_library:/app/data/library
    ports:
      - "127.0.0.1:8001:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Per-queue workers, matching CELERY_TASK_ROUTES in config/settings/base.py.
  # A single unqualified `celery worker` only consumes Celery's implicit
  # default queue ("celery") — every task routed elsewhere needs a worker
  # explicitly subscribed to its queue via -Q, or it just sits unconsumed in
  # Redis forever. apps.accounts.tasks (password-reset mail, token pruning) is
  # deliberately left on "celery" so it rides this worker without a new service.
  celery-worker:
    build:
      context: ./backend
    command: celery -A config worker -l info -Q celery,downloads
    restart: unless-stopped
    env_file: ./backend/.env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.development
    volumes:
      - ./backend:/app
      - staged_files:/app/data/staged
      - torrent_data:/app/data/torrents
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Dedicated so qBittorrent's frequent poll_active_torrents ticks never
  # queue behind a slow HTTP download or ingestion scrape.
  celery-worker-torrents:
    build:
      context: ./backend
    command: celery -A config worker -l info -Q torrents
    restart: unless-stopped
    env_file: ./backend/.env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.development
    volumes:
      - ./backend:/app
      - staged_files:/app/data/staged
      - torrent_data:/app/data/torrents
      - rom_library:/app/data/library
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ROM-set extraction only. Unpacking a 5-20GB archive occupies its worker
  # for minutes at a time, so it must not share the torrents queue with the
  # 3s/5s poll beats. --concurrency=1 because two simultaneous extractions
  # would double peak disk use on the very volume the reserve is protecting.
  celery-worker-romsets:
    build:
      context: ./backend
    command: celery -A config worker -l info -Q romsets --concurrency=1
    restart: unless-stopped
    env_file: ./backend/.env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.development
    volumes:
      - ./backend:/app
      - rom_library:/app/data/library
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Long-running, low-concurrency catalog scrapes — isolated so a big
  # ingestion run can't starve user-facing downloads.
  celery-worker-ingestion:
    build:
      context: ./backend
    command: celery -A config worker -l info -Q ingestion --concurrency=2
    restart: unless-stopped
    env_file: ./backend/.env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.development
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # External-API-bound (IA login/revalidate, ScreenScraper/SteamGridDB) —
  # network-latency-heavy, doesn't need the download pipeline's volumes.
  celery-worker-external:
    build:
      context: ./backend
    command: celery -A config worker -l info -Q credentials,metadata
    restart: unless-stopped
    env_file: ./backend/.env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.development
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery-beat:
    build:
      context: ./backend
    command: celery -A config beat -l info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    restart: unless-stopped
    env_file: ./backend/.env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.development
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  qbittorrent:
    image: linuxserver/qbittorrent:latest
    environment:
      PUID: 1000
      PGID: 1000
      TZ: UTC
      WEBUI_PORT: 8080
    # linuxserver/qbittorrent is Alpine-based (musl libc), which has a
    # well-documented DNS resolution problem specifically under Docker
    # Desktop's network virtualization — confirmed live: a raw UDP packet
    # to Docker's own embedded resolver (127.0.0.11:53) got zero response
    # from this container, while the same test from the Debian-based
    # django container worked fine. That silently broke every DHT
    # bootstrap node lookup *and* every HTTP/UDP tracker announce (both
    # need DNS), so no peer discovery mechanism worked at all — not a
    # MiNERVA-specific or DHT-specific issue. Bypassing Docker's embedded
    # resolver with public DNS directly is the standard workaround.
    dns:
      - 1.1.1.1
      - 8.8.8.8
    volumes:
      # Without this, every recreate of this container starts qBittorrent
      # from scratch: it loses its torrent state AND its WebUI password, and
      # linuxserver's entrypoint generates a fresh random temporary one. The
      # QBITTORRENT_PASSWORD in .env then no longer matches, every API call
      # fails to authenticate, and qBittorrent bans the caller's IP for
      # trying too often — which surfaces as ROM sets and torrent downloads
      # failing with "Your IP address has been banned".
      - qbittorrent_config:/config
      - torrent_data:/downloads
      # ROM sets are saved straight into the library rather than downloaded
      # here and copied afterwards — a 20GB copy between two volumes at the
      # end of every set would double both the time and the peak disk use.
      # Must stay in sync with QBITTORRENT_LIBRARY_PATH.
      - rom_library:/library
    ports:
      - "127.0.0.1:8080:8080"
      # BitTorrent peer/DHT port — without this published, qBittorrent has
      # no reachable inbound port and (confirmed live) never bootstraps
      # into the DHT network at all, so a trackerless magnet (MiNERVA's
      # links carry no embedded trackers) can never find peers.
      - "6881:6881/tcp"
      - "6881:6881/udp"

  sveltekit:
    build:
      context: ./frontend
    command: npm run dev -- --host
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      VITE_API_BASE_URL: http://localhost:8001/api
      VITE_WS_BASE_URL: ws://localhost:8001/ws
    ports:
      - "127.0.0.1:5174:5173"
    depends_on:
      - django

volumes:
  postgres_data:
  staged_files:
  torrent_data:
  qbittorrent_config:
  # Where completed ROM sets live. Unlike staged_files this is never swept —
  # it is the user's library, so it is a bind mount to a real host folder
  # rather than a named volume: on macOS a named volume lives inside the
  # Docker VM, where Finder can't reach it and the only way to get a 5GB set
  # out is `docker compose cp`.
  #
  # Point it wherever you want sets to land (a NAS share, the folder your
  # cabinet reads) by setting ROM_LIBRARY_HOST_PATH in a .env file next to
  # this one. Must be an ABSOLUTE path — the bind driver won't resolve a
  # relative one — must exist before `up`, and if it's a network mount it
  # must be mounted, or the containers won't start.
  rom_library:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${ROM_LIBRARY_HOST_PATH:-/Users/marcgreenwood/roms}
